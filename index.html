<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Survival Tycoon</title>
<style>
  * { box-sizing: border-box; font-family: 'Courier New', monospace; margin:0; padding:0; }
  body { background:#0a0a0a; color:#cfcfcf; min-height:100vh; }
  #topbar { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#111; border-bottom:1px solid #2a2a2a; position:sticky; top:0; z-index:10; }
  #topbar .logo { color:#7fd1ff; font-weight:bold; letter-spacing:2px; }
  #topbar .spacer { flex:1; }
  #topbar button { background:#1c1c1c; color:#ddd; border:1px solid #3a3a3a; padding:6px 12px; cursor:pointer; font-size:12px; }
  #topbar button:hover { background:#262626; border-color:#5a5a5a; }
  #userInfo { font-size:12px; color:#888; }
  #panels { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:10px; padding:10px; }
  .panel { background:#0f0f0f; border:1px solid #232323; padding:12px; border-radius:4px; }
  .panel h2 { font-size:13px; color:#7fd1ff; margin-bottom:10px; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid #1e1e1e; padding-bottom:6px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px dotted #1e1e1e; font-size:12px; }
  .row:last-child { border-bottom:none; }
  .row button { background:#1a1a1a; color:#bbb; border:1px solid #333; padding:2px 6px; font-size:10px; cursor:pointer; margin-left:4px; }
  .row button:hover { background:#252525; color:#fff; }
  .green { color:#4caf50; } .red { color:#e53935; } .yellow { color:#ffc107; } .blue { color:#42a5f5; }
  #loginScreen { position:fixed; inset:0; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:100; padding:20px; }
  #loginScreen h1 { color:#7fd1ff; letter-spacing:6px; font-size:26px; margin-bottom:8px; }
  #loginScreen p { color:#666; font-size:12px; margin-bottom:8px; }
  #loginScreen input { width:280px; padding:10px 12px; background:#151515; color:#ddd; border:1px solid #333; font-size:13px; outline:none; }
  #loginScreen input:focus { border-color:#7fd1ff; }
  #loginScreen .btnrow { display:flex; gap:8px; margin-top:8px; }
  #loginScreen button { background:#1c1c1c; color:#fff; border:1px solid #444; padding:10px 20px; font-size:13px; cursor:pointer; letter-spacing:1px; }
  #loginScreen button:hover { background:#262626; border-color:#7fd1ff; }
  #loginScreen .toggle { color:#7fd1ff; font-size:11px; cursor:pointer; text-decoration:underline; margin-top:6px; }
  #toast { position:fixed; bottom:20px; right:20px; background:#151515; border:1px solid #333; padding:10px 16px; font-size:12px; color:#ddd; border-radius:4px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:200; }
  #toast.show { opacity:1; }
  #adminPanel { position:fixed; top:50px; right:10px; width:380px; max-height:80vh; overflow-y:auto; background:#0b0b0b; border:1px solid #7fd1ff; padding:12px; border-radius:4px; z-index:150; display:none; }
  #adminPanel h3 { color:#7fd1ff; font-size:13px; margin-bottom:10px; letter-spacing:1px; }
  #adminPanel .adm-row { display:flex; gap:4px; align-items:center; padding:3px 0; border-bottom:1px dotted #222; font-size:11px; }
  #adminPanel .adm-row input { background:#1a1a1a; color:#ddd; border:1px solid #333; padding:2px 4px; font-size:11px; width:70px; }
  #adminPanel .adm-row button { background:#1a1a1a; color:#bbb; border:1px solid #333; padding:2px 6px; font-size:10px; cursor:pointer; }
  #adminPanel .adm-row button:hover { background:#252525; color:#fff; }
  #adminPanel .adm-tools { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  #adminPanel .adm-tools button { background:#1a1a1a; color:#bbb; border:1px solid #333; padding:4px 8px; font-size:10px; cursor:pointer; }
  #adminPanel .adm-tools button:hover { background:#252525; color:#fff; }
  #adminPanel .close { position:absolute; top:6px; right:8px; cursor:pointer; color:#888; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>SURVIVAL TYCOON</h1>
  <p>Metin tabanlı ekonomi / hayatta kalma simülasyonu</p>
  <input id="inpEmail" type="email" placeholder="E-posta" />
  <input id="inpPass" type="password" placeholder="Şifre" />
  <div class="btnrow">
    <button id="btnLogin">GİRİŞ YAP</button>
    <button id="btnRegister">KAYIT OL</button>
  </div>
  <div class="toggle" id="toggleMode">Hesabın yok mu? Kayıt ol</div>
</div>

<header id="topbar" hidden>
  <span class="logo">SURVIVAL TYCOON</span>
  <span class="spacer"></span>
  <span id="userInfo"></span>
  <button id="logoutBtn">ÇIKIŞ</button>
</header>

<main id="panels" hidden>
  <section class="panel"><h2>Durum</h2><div id="statusBox">-</div></section>
  <section class="panel"><h2>Borsa / Kripto</h2><div id="marketList"></div></section>
  <section class="panel"><h2>Portföy & Varlıklar</h2><div id="assetList"></div></section>
  <section class="panel"><h2>İş</h2><div id="jobList"></div></section>
  <section class="panel"><h2>Suç / Risk</h2><div id="crimeBox"></div></section>
  <section class="panel"><h2>Borç / Kredi</h2><div id="creditBox"></div></section>
  <section class="panel"><h2>Sıralama (Top 20)</h2><div id="rankingBox"></div></section>
  <section class="panel"><h2>Log</h2><div id="logBox" style="font-size:11px; color:#666; max-height:200px; overflow-y:auto;"></div></section>
</main>

<div id="adminPanel">
  <span class="close" id="admClose">✕</span>
  <h3>ADMIN PANELİ</h3>
  <div id="admUsers"></div>
  <div class="adm-tools">
    <button id="admGlobalAdd">Global +1000 TL</button>
    <button id="admGlobalSub">Global -1000 TL</button>
    <button id="admResetMarket">Market Sıfırla</button>
    <button id="admRefresh">Yenile</button>
    <button id="admTestTg">TG Test</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAkJQzLDkskx8uFbKtzpS_PG1nDopYo_bY",
  authDomain: "survival-ycn.firebaseapp.com",
  projectId: "survival-ycn",
  storageBucket: "survival-ycn.firebasestorage.app",
  messagingSenderId: "718596663493",
  appId: "1:718596663493:web:1edf6e1531afa4bda668ac",
  measurementId: "G-VCD05CGM81"
};

const TG_TOKEN = "8600556676:AAFc6dqxJpHnNbhdYBkf7QBmLINUs86J-sI";
const TG_CHAT  = "8788868439";
const ADMIN_USER = "72ADMIN";
const ADMIN_PASS = "72ADMIN";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const COINS = ["BTC","ETH","SOL","BNB","XRP","ADA","DOGE","AVAX","DOT","LINK"];
const BASE_PRICE = { BTC:60000, ETH:3000, SOL:150, BNB:400, XRP:0.5, ADA:0.4, DOGE:0.08, AVAX:30, DOT:6, LINK:14 };
const JOBS = [
  { id:"kurye", name:"Kurye", pay:120, risk:0.02 },
  { id:"garson", name:"Garson", pay:150, risk:0.01 },
  { id:"insaat", name:"İnşaat İşçisi", pay:220, risk:0.05 },
  { id:"yazilim", name:"Yazılımcı", pay:600, risk:0.00 },
  { id:"doktor", name:"Doktor", pay:900, risk:0.00 }
];
const CRIMES = [
  { id:"market", name:"Market Soygunu", min:200, max:900, risk:0.35 },
  { id:"bank", name:"Banka Soygunu", min:2000, max:9000, risk:0.65 },
  { id:"arac", name:"Araç Hırsızlığı", min:800, max:3000, risk:0.45 },
  { id:"kasa", name:"Kasa Kırma", min:500, max:2500, risk:0.40 }
];
const ASSETS = [
  { id:"araba", name:"Araba", price:150000 },
  { id:"ev", name:"Ev", price:900000 },
  { id:"dukkan", name:"Dükkan", price:400000 },
  { id:"emlak", name:"Emlak", price:1500000 }
];

const $ = id => document.getElementById(id);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const uid = () => auth.currentUser ? auth.currentUser.uid : null;
let isAdmin = false;
let mode = "login";

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2500); }
function log(msg){ const b=$("logBox"); if(!b) return; const line=document.createElement("div"); line.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`; b.prepend(line); if(b.childNodes.length>50) b.removeChild(b.lastChild); }

async function tgLog(text){
  try {
    await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ chat_id: TG_CHAT, text: text, parse_mode:"HTML" })
    });
  } catch(e){ console.warn("TG log hatası", e); }
}

/* ============ KAYIT / GİRİŞ MOD DEĞİŞTİR ============ */
$("toggleMode").onclick = () => {
  mode = mode === "login" ? "register" : "login";
  if (mode === "register") {
    $("toggleMode").textContent = "Hesabın var mı? Giriş yap";
    $("btnRegister").style.display = "inline-block";
    $("btnLogin").style.display = "none";
  } else {
    $("toggleMode").textContent = "Hesabın yok mu? Kayıt ol";
    $("btnRegister").style.display = "none";
    $("btnLogin").style.display = "inline-block";
  }
};
// Başlangıçta sadece Login görünsün
$("btnRegister").style.display = "none";

/* ============ ADMIN GİRİŞ ÖZEL KONTROL ============ */
async function tryAdminLogin(email, pass) {
  // Admin: kullanıcı adı "72ADMIN", şifre "72ADMIN"
  // Firebase email formatı gerekli -> sahte email oluştur
  if (email.toLowerCase() === ADMIN_USER.toLowerCase() && pass === ADMIN_PASS) {
    const adminEmail = "admin@survival-tycoon.local";
    try {
      await signInWithEmailAndPassword(auth, adminEmail, ADMIN_PASS);
    } catch(e) {
      if (e.code === "auth/user-not-found" || e.code === "auth/invalid-credential") {
        // Admin hesabı yok, oluştur
        try {
          const cred = await createUserWithEmailAndPassword(auth, adminEmail, ADMIN_PASS);
          await updateProfile(cred.user, { displayName: ADMIN_USER });
        } catch(e2) {
          toast("Admin oluşturulamadı: " + e2.message);
          return false;
        }
      } else {
        toast("Admin giriş hatası: " + e.message);
        return false;
      }
    }
    isAdmin = true;
    tgLog(`🔐 <b>ADMIN GİRİŞİ</b>\n👤 ${ADMIN_USER}`);
    return true;
  }
  return false;
}

/* ============ GİRİŞ BUTONU ============ */
$("btnLogin").onclick = async () => {
  const email = $("inpEmail").value.trim();
  const pass  = $("inpPass").value;
  if (!email || !pass) return toast("E-posta ve şifre gir.");

  // Önce admin mi diye kontrol et
  const adminOk = await tryAdminLogin(email, pass);
  if (adminOk) return; // onAuthStateChanged halledecek

  // Normal kullanıcı girişi
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    let msg = e.message;
    if (e.code === "auth/user-not-found") msg = "Kullanıcı bulunamadı. Önce kayıt ol.";
    if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Şifre yanlış.";
    if (e.code === "auth/invalid-email") msg = "Geçersiz e-posta.";
    toast("Giriş hatası: " + msg);
  }
};

/* ============ KAYIT BUTONU ============ */
$("btnRegister").onclick = async () => {
  const email = $("inpEmail").value.trim();
  const pass  = $("inpPass").value;
  if (!email || !pass) return toast("E-posta ve şifre gir.");
  if (pass.length < 6) return toast("Şifre en az 6 karakter olmalı.");
  if (email.toLowerCase() === ADMIN_USER.toLowerCase()) return toast("Bu isim kullanılamaz.");

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const name = email.split("@")[0];
    await updateProfile(cred.user, { displayName: name });
  } catch(e) {
    let msg = e.message;
    if (e.code === "auth/email-already-in-use") msg = "Bu e-posta zaten kayıtlı.";
    if (e.code === "auth/weak-password") msg = "Şifre çok zayıf.";
    if (e.code === "auth/invalid-email") msg = "Geçersiz e-posta.";
    toast("Kayıt hatası: " + msg);
  }
};

$("logoutBtn").onclick = () => {
  isAdmin = false;
  $("adminPanel").style.display = "none";
  signOut(auth);
};

/* ============ AUTH DURUMU ============ */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    $("loginScreen").hidden = true;
    $("topbar").hidden = false;
    $("panels").hidden = false;
    $("userInfo").textContent = (user.displayName || user.email) + " | " + user.email;
    await ensureUserDoc(user);
    const snap = await getDoc(doc(db,"users",user.uid));
    if (snap.data()?.banned) {
      document.body.innerHTML = `<div style="padding:40px;text-align:center;color:#e53935;font-family:monospace;">
        <h1>HESABIN BANLANDI</h1><p>Admin tarafından erişimin kısıtlandı.</p></div>`;
      return;
    }
    await refreshAll();
    log("Giriş: " + user.email);
    if (isAdmin) {
      $("adminPanel").style.display = "block";
      loadAdminPanel();
    }
  } else {
    $("loginScreen").hidden = false;
    $("topbar").hidden = true;
    $("panels").hidden = true;
    $("adminPanel").style.display = "none";
  }
});

async function ensureUserDoc(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    const init = {
      name: user.displayName || user.email.split("@")[0],
      email: user.email || "",
      cash: 1000, debt: 0, age: 18, health: 100, energy: 100,
      wanted: 0, jailUntil: 0, banned: false, createdAt: Date.now(),
      assets: [], portfolio: {}, isAdmin: user.email === "admin@survival-tycoon.local"
    };
    await setDoc(ref, init);
    await tgLog(`🆕 <b>YENİ HESAP</b>\n👤 ${init.name}\n📧 <code>${init.email}</code>\n🆔 <code>${user.uid}</code>`);
    log("Hesap kuruldu: " + init.name);
  }
}

async function getMarket() {
  const ref = doc(db, "market", "global");
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    const prices = {}; COINS.forEach(c => prices[c] = BASE_PRICE[c]);
    await setDoc(ref, { prices, day:1, updatedAt: Date.now() });
    return prices;
  }
  return snap.data().prices;
}

async function buyCoin(symbol, amountTry) {
  const u = uid(); if (!u) return;
  const prices = await getMarket(); const price = prices[symbol];
  const adet = +(amountTry / price).toFixed(8);
  const ref = doc(db, "users", u);
  const snap = await getDoc(ref); const d = snap.data();
  if (d.cash < amountTry) return toast("Yetersiz nakit.");
  const portfolio = d.portfolio || {};
  const cur = portfolio[symbol] || { amount:0, avg:0 };
  const yeniAdet = cur.amount + adet;
  const yeniOrt = ((cur.avg*cur.amount)+(price*adet))/yeniAdet;
  portfolio[symbol] = { amount:+yeniAdet.toFixed(8), avg:+yeniOrt.toFixed(6) };
  await updateDoc(ref, { cash: d.cash - amountTry, portfolio });
  log(`${symbol} alındı: ${adet} @ ${price}`); await refreshAll();
}

async function sellCoin(symbol, adet) {
  const u = uid(); if (!u) return;
  const prices = await getMarket(); const price = prices[symbol];
  const ref = doc(db, "users", u);
  const snap = await getDoc(ref); const d = snap.data();
  const portfolio = d.portfolio || {}; const cur = portfolio[symbol];
  if (!cur || cur.amount < adet) return toast("Yetersiz coin.");
  const gelir = +(adet*price).toFixed(2);
  cur.amount = +(cur.amount - adet).toFixed(8);
  if (cur.amount <= 0) delete portfolio[symbol];
  await updateDoc(ref, { cash: d.cash + gelir, portfolio });
  log(`${symbol} satıldı: ${adet} @ ${price} = +${gelir} TL`); await refreshAll();
}

async function work(jobId) {
  const u = uid(); if (!u) return;
  const job = JOBS.find(j => j.id === jobId);
  const ref = doc(db, "users", u);
  const snap = await getDoc(ref); const d = snap.data();
  if (d.energy < 10) return toast("Enerjin yok.");
  let pay = job.pay; const kaza = Math.random() < job.risk;
  if (kaza) pay = Math.floor(pay*0.3);
  await updateDoc(ref, { cash: d.cash + pay, energy: Math.max(0, d.energy-10), health: Math.max(0, d.health - (kaza?10:0)) });
  log(`${job.name}: +${pay} TL${kaza?" (kaza!)":""}`); await refreshAll();
}

async function commitCrime(crimeId) {
  const u = uid(); if (!u) return;
  const c = CRIMES.find(x => x.id === crimeId);
  const ref = doc(db, "users", u);
  const snap = await getDoc(ref); const d = snap.data();
  if (d.jailUntil && d.jailUntil > Date.now()) return toast("Hapistesin.");
  const basarili = Math.random() > c.risk;
  if (basarili) {
    const kazanc = rnd(c.min, c.max);
    await updateDoc(ref, { cash: d.cash + kazanc, wanted: Math.min(100, (d.wanted||0)+10) });
    toast(`Başarılı! +${kazanc} TL`); log(`${c.name}: başarılı +${kazanc} TL`);
  } else {
    const ceza = rnd(500, 3000);
    await updateDoc(ref, { cash: Math.max(0, d.cash-ceza), wanted: Math.min(100, (d.wanted||0)+25), jailUntil: Date.now() + 1000*60*5 });
    toast(`Yakalandın! -${ceza} TL, 5 dk hapis.`); log(`${c.name}: YAKALANDI -${ceza} TL`);
  }
  await refreshAll();
}

async function buyAsset(assetId) {
  const u = uid(); if (!u) return;
  const a = ASSETS.find(x => x.id === assetId);
  const ref = doc(db, "users", u);
  const snap = await getDoc(ref); const d = snap.data();
  if (d.cash < a.price) return toast("Yetersiz nakit.");
  const assets = d.assets || [];
  assets.push({ id:a.id, name:a.name, buyPrice:a.price, buyAt:Date.now() });
  await updateDoc(ref, { cash: d.cash - a.price, assets });
  log(`${a.name} alındı: -${a.price} TL`); await refreshAll();
}

async function takeLoan(amount) {
  const u = uid(); if (!u) return;
  const ref = doc(db, "users", u);
  const snap = await getDoc(ref); const d = snap.data();
  if ((d.debt||0)+amount > 50000) return toast("Kredi limiti aşıldı.");
  await updateDoc(ref, { cash: d.cash + amount, debt: (d.debt||0) + Math.floor(amount*1.2) });
  log(`Kredi: +${amount} TL`); await refreshAll();
}
async function payDebt(amount) {
  const u = uid(); if (!u) return;
  const ref = doc(db, "users", u);
  const snap = await getDoc(ref); const d = snap.data();
  if (d.cash < amount) return toast("Yetersiz nakit.");
  const yeni = Math.max(0, (d.debt||0)-amount);
  await updateDoc(ref, { cash: d.cash-amount, debt: yeni });
  log(`Borç ödendi: -${amount} TL`); await refreshAll();
}

async function refreshRanking() {
  const q = query(collection(db,"users"), orderBy("cash","desc"), limit(20));
  const s = await getDocs(q);
  const box = $("rankingBox"); box.innerHTML = "";
  let i = 1;
  s.forEach(docu => {
    const d = docu.data();
    const row = document.createElement("div"); row.className = "row";
    const renk = i===1?"yellow":i===2?"blue":i===3?"green":"";
    row.innerHTML = `<span class="${renk}">#${i} ${d.name}</span><span>${Math.floor(d.cash)} TL</span>`;
    box.appendChild(row); i++;
  });
}

async function refreshAll() {
  const u = uid(); if (!u) return;
  const ref = doc(db, "users", u);
  const snap = await getDoc(ref); const d = snap.data();
  if (!d) return;
  const prices = await getMarket();

  $("statusBox").innerHTML = `
    <div class="row"><span>Nakit</span><span class="green">${Math.floor(d.cash)} TL</span></div>
    <div class="row"><span>Borç</span><span class="red">${Math.floor(d.debt||0)} TL</span></div>
    <div class="row"><span>Yaş</span><span>${d.age}</span></div>
    <div class="row"><span>Sağlık</span><span>${d.health}</span></div>
    <div class="row"><span>Enerji</span><span>${d.energy}</span></div>
    <div class="row"><span>Aranma</span><span class="yellow">${d.wanted||0}</span></div>
    <div class="row"><span>Hapis</span><span>${d.jailUntil>Date.now()?"EVET":"hayır"}</span></div>`;

  const ml = $("marketList"); ml.innerHTML = "";
  COINS.forEach(c => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span>${c}</span><span>${prices[c]}</span>`;
    const b = document.createElement("button"); b.textContent="Al 100"; b.onclick = () => buyCoin(c, 100);
    const s = document.createElement("button"); s.textContent="Sat 0.001"; s.onclick = () => sellCoin(c, 0.001);
    row.appendChild(b); row.appendChild(s); ml.appendChild(row);
  });

  const al = $("assetList"); al.innerHTML = "";
  const port = d.portfolio || {};
  Object.keys(port).forEach(k => {
    const v = port[k]; const deger = (v.amount*prices[k]).toFixed(2);
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span>${k}: ${v.amount}</span><span class="green">${deger} TL</span>`;
    al.appendChild(row);
  });
  (d.assets||[]).forEach(a => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span>${a.name}</span><span>${a.buyPrice} TL</span>`;
    al.appendChild(row);
  });

  const jl = $("jobList"); jl.innerHTML = "";
  JOBS.forEach(j => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span>${j.name} (+${j.pay})</span>`;
    const b = document.createElement("button"); b.textContent="Çalış"; b.onclick = () => work(j.id);
    row.appendChild(b); jl.appendChild(row);
  });

  const cl = $("crimeBox"); cl.innerHTML = "";
  CRIMES.forEach(c => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span>${c.name} (%${Math.round(c.risk*100)})</span>`;
    const b = document.createElement("button"); b.textContent="Yap"; b.onclick = () => commitCrime(c.id);
    row.appendChild(b); cl.appendChild(row);
  });

  const cl2 = $("creditBox"); cl2.innerHTML = "";
  ASSETS.forEach(a => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span>${a.name}</span><span>${a.price} TL</span>`;
    const b = document.createElement("button"); b.textContent="Al"; b.onclick = () => buyAsset(a.id);
    row.appendChild(b); cl2.appendChild(row);
  });
  const l1 = document.createElement("button"); l1.textContent="1000 TL Kredi Çek"; l1.onclick = () => takeLoan(1000);
  const l2 = document.createElement("button"); l2.textContent="1000 TL Borç Öde"; l2.onclick = () => payDebt(1000);
  cl2.appendChild(l1); cl2.appendChild(l2);

  await refreshRanking();
  if (isAdmin) loadAdminPanel();
}

/* ============ ADMIN PANEL ============ */
$("admClose").onclick = () => { $("adminPanel").style.display = "none"; };

async function loadAdminPanel() {
  const q = query(collection(db,"users"), orderBy("cash","desc"), limit(50));
  const s = await getDocs(q);
  const box = $("admUsers"); box.innerHTML = "";
  s.forEach(docu => {
    const d = docu.data();
    const row = document.createElement("div"); row.className = "adm-row";
    row.innerHTML = `<span style="flex:1;font-size:10px;color:${d.banned?'#e53935':'#888'}">${d.name||"?"} | ${d.email||"?"} | ${Math.floor(d.cash)} TL</span>`;
    const inp = document.createElement("input"); inp.placeholder="miktar"; inp.type="number";
    const bAdd = document.createElement("button"); bAdd.textContent="+";
    bAdd.onclick = async () => {
      const v = parseInt(inp.value); if (!v) return;
      await updateDoc(doc(db,"users",docu.id), { cash: (d.cash||0) + v });
      tgLog(`💰 <b>ADMIN PARA EKLEME</b>\n👤 ${d.name}\n+${v} TL`);
      loadAdminPanel();
    };
    const bSub = document.createElement("button"); bSub.textContent="−";
    bSub.onclick = async () => {
      const v = parseInt(inp.value); if (!v) return;
      await updateDoc(doc(db,"users",docu.id), { cash: Math.max(0,(d.cash||0) - v) });
      tgLog(`💸 <b>ADMIN PARA SİLME</b>\n👤 ${d.name}\n-${v} TL`);
      loadAdminPanel();
    };
    const bBan = document.createElement("button");
    bBan.textContent = d.banned ? "UNBAN" : "BAN";
    bBan.onclick = async () => {
      await updateDoc(doc(db,"users",docu.id), { banned: !d.banned });
      tgLog(`${d.banned?'✅ UNBAN':'🚫 BAN'}: ${d.name} (${d.email})`);
      loadAdminPanel();
    };
    row.appendChild(inp); row.appendChild(bAdd); row.appendChild(bSub); row.appendChild(bBan);
    box.appendChild(row);
  });
}

$("admGlobalAdd").onclick = async () => {
  const s = await getDocs(collection(db,"users"));
  for (const d of s.docs) {
    await updateDoc(d.ref, { cash: (d.data().cash||0) + 1000 });
  }
  tgLog(`🌍 <b>GLOBAL +1000 TL</b> (${s.size} oyuncu)`);
  toast("Global +1000 TL uygulandı"); loadAdminPanel();
};
$("admGlobalSub").onclick = async () => {
  const s = await getDocs(collection(db,"users"));
  for (const d of s.docs) {
    await updateDoc(d.ref, { cash: Math.max(0,(d.data().cash||0) - 1000) });
  }
  tgLog(`🌍 <b>GLOBAL -1000 TL</b> (${s.size} oyuncu)`);
  toast("Global -1000 TL uygulandı"); loadAdminPanel();
};
$("admResetMarket").onclick = async () => {
  const prices = {}; COINS.forEach(c => prices[c] = BASE_PRICE[c]);
  await updateDoc(doc(db,"market","global"), { prices, updatedAt: Date.now() });
  tgLog(`📊 <b>MARKET SIFIRLANDI</b>`);
  toast("Market sıfırlandı"); refreshAll();
};
$("admRefresh").onclick = () => loadAdminPanel();
$("admTestTg").onclick = () => tgLog(`🧪 Test mesajı - ${new Date().toLocaleString("tr-TR")}`);

setInterval(async () => {
  if (!uid()) return;
  const ref = doc(db, "users", uid());
  const snap = await getDoc(ref); const d = snap.data();
  if (!d) return;
  await updateDoc(ref, { energy: Math.min(100, (d.energy||0)+5) });
  await refreshAll();
}, 60000);
</script>
