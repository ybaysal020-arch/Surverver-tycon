async function tgLog(text){

    await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {

}

function hasItem(inv, key) { return inv && inv[key] && inv[key] > 0; }
function hasAny(inv, keys) { return keys.some(k => hasItem(inv, k)); }
function getBestWeapon(inv) {
  let best = null, bestPower = 0;
  Object.keys(inv || {}).forEach(k => {
    if (inv[k] > 0 && ITEMS[k] && ITEMS[k].power > bestPower) { best = k; bestPower = ITEMS[k].power; }
  });
  return { key: best, power: bestPower };
}

function openModal(title, sub, plans, onPick) {
  $("modalTitle").style.display = "block";
  $("modalSub").style.display = "block";
  $("modalTitle").textContent = title;
  $("modalSub").textContent = sub;
  const box = $("modalPlans"); box.innerHTML = "";
  plans.forEach((p, i) => {
    const d = document.createElement("div");
    d.className = "plan" + (p.risk >= 0.7 ? " danger" : p.risk <= 0.35 ? " safe" : "");
    d.innerHTML = `<h4>${p.name}</h4><div class="meta">
      ${p.min !== undefined ? `💰 Kazanç: <b>${p.min.toLocaleString()} - ${p.max.toLocaleString()} TL</b><br>` : ""}

      ${p.bribe ? `<br>💸 Ön ödeme: <b>${p.bribe.toLocaleString()} TL</b>` : ""}
    </div>`;
    d.onclick = () => { closeModal(); onPick(p); };
    box.appendChild(d);
  });

/* ============ HAZIR HESAP GİRİŞİ ============ */
async function tryPresetLogin(user, pass) {
  const preset = PRESET_USERS[user];
  if (!preset) return false;
  if (preset.pass !== pass) return false;

  try {
    await signInWithEmailAndPassword(auth, preset.email, pass);
  } catch(e) {
    if (e.code === "auth/user-not-found" || e.code === "auth/invalid-credential") {
      try {
        const cred = await createUserWithEmailAndPassword(auth, preset.email, pass);
        await updateProfile(cred.user, { displayName: user });
      } catch(e2) { toast("Hesap oluşturulamadı: " + e2.message); return false; }
    } else { toast("Giriş: " + e.message); return false; }
  }
  isAdmin = preset.admin;
  if (preset.admin) tgLog(`🔐 <b>ADMIN GİRİŞİ</b>`);
  return true;
}

/* ============ SUBMIT ============ */
$("btnSubmit").onclick = async () => {
  try {
    const input = $("inpEmail").value.trim();
    const pass = $("inpPass").value;
    if (!input || !pass) return toast("Tüm alanları doldur.");

    if (mode === "login") {
      // Önce hazır hesap mı kontrol
      const presetOk = await tryPresetLogin(input, pass);
      if (presetOk) return;

      // Normal giriş
      const email = input.includes("@") ? input : input + "@survival-tycoon.local";
      try { await signInWithEmailAndPassword(auth, email, pass); }
      catch(e) {
        let msg = e.message;
        if (e.code === "auth/user-not-found") msg = "Kullanıcı yok.";
        if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Şifre yanlış.";
        toast("Giriş: " + msg);
      }
      return;
    }

    // Kayıt
    if (!input.includes("@")) return toast("Kayıt için gerçek e-posta gir.");
    const p2 = $("inpPass2").value;
    if (pass !== p2) return toast("Şifreler uyuşmuyor.");
    if (pass.length < 6) return toast("Min 6 karakter.");
    try {
      const cred = await createUserWithEmailAndPassword(auth, input, pass);
      await updateProfile(cred.user, { displayName: input.split("@")[0] });
      toast("Kayıt başarılı!");
    } catch(e) {
      let msg = e.message;
      if (e.code === "auth/email-already-in-use") msg = "Bu e-posta kayıtlı.";
      toast("Kayıt: " + msg);
    }
  } catch(e){ toast("Hata: " + e.message); }
};

        return;
      }

      await refreshAll();
      log("Giriş: " + name);
      startJailCheck();
      startHideCheck();

      if (d?.isAdmin || isAdmin) {
        $("adminPanel").style.display = "block";
        loadAdminPanel();
      }
    } else {
      $("loginScreen").hidden = false;
      $("topbar").hidden = true;
      $("panels").hidden = true;
      $("adminPanel").style.display = "none";
      $("jailBanner").classList.remove("show");
      $("hideBanner").classList.remove("show");
      if (jailInterval) clearInterval(jailInterval);
      if (hideInterval) clearInterval(hideInterval);
      currentUserData = null;
    }
  } catch(e) {
    alert("AUTH HATASI: " + e.message);
  }
});

async function ensureUserDoc(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    const isPresetAdmin = Object.values(PRESET_USERS).some(p => p.email === user.email && p.admin);
    const init = {
      name: user.displayName || user.email.split("@")[0],
      email: user.email || "",
      cash: 500, debt: 0, age: 18, health: 50, maxHealth: 50, energy: 100,
      wanted: 0, jailUntil: 0, banned: false, createdAt: Date.now(),
      assets: [], portfolio: {}, inventory: {}, isAdmin: isPresetAdmin,
      lastIncome: Date.now(), lastHealthTick: Date.now(),
      hiding: false, hidingUntil: 0, hidingIn: "",
      notifications: []
    };
    await setDoc(ref, init);
    await tgLog(`🆕 <b>YENİ HESAP</b>\n👤 ${init.name}\n📧 <code>${init.email}</code>${isPresetAdmin?"\n👑 ADMIN":""}`);
    log("Hesap: " + init.name);
  }
}

async function getMarket() {
  const ref = doc(db, "market", "global");
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    const prices = {}; COINS.forEach(c => prices[c] = BASE_PRICE[c]);
    await setDoc(ref, { prices, day:1, updatedAt: Date.now() });
    return prices;
  }
  return snap.data().prices || BASE_PRICE;
}

/* HAPİS */
function startJailCheck() {
  if (jailInterval) clearInterval(jailInterval);
  jailInterval = setInterval(async () => {
    try {
      const u = uid(); if (!u) return;
      const snap = await getDoc(doc(db,"users",u));
      const d = snap.data(); if (!d) return;
      const jail = d.jailUntil || 0;
      const now = Date.now();
      if (jail > now) {
        $("jailBanner").classList.add("show");
        const kalan = Math.floor((jail - now) / 1000);
        $("jailTimer").textContent = `${Math.floor(kalan/60)}:${(kalan%60).toString().padStart(2,"0")}`;
      } else $("jailBanner").classList.remove("show");
    } catch(e){}
  }, 1000);
}
async function isInJail() {
  const u = uid(); if (!u) return false;
  const snap = await getDoc(doc(db,"users",u));
  const d = snap.data(); if (!d) return false;
  if (d.jailUntil && d.jailUntil > Date.now()) { toast("🔒 Hapistesin!"); return true; }
  return false;
}

/* SAKLANMA */
function startHideCheck() {
  if (hideInterval) clearInterval(hideInterval);
  hideInterval = setInterval(async () => {
    try {
      const u = uid(); if (!u) return;
      const snap = await getDoc(doc(db,"users",u));
      const d = snap.data(); if (!d) return;
      const hideUntil = d.hidingUntil || 0;
      const now = Date.now();
      if (d.hiding && hideUntil > now) {
        $("hideBanner").classList.add("show");
        const kalan = Math.floor((hideUntil - now) / 1000);
        $("hideTimer").textContent = `${Math.floor(kalan/60)}:${(kalan%60).toString().padStart(2,"0")} (${d.hidingIn||"sokak"})`;
      } else {
        $("hideBanner").classList.remove("show");
        if (d.hiding) await updateDoc(doc(db,"users",u), { hiding: false });
      }
    } catch(e){}
  }, 1000);
}

    if (await isInJail()) return;
    const u = uid(); if (!u) return;
    const ref = doc(db, "users", u);

}
async function performAttack(n, plan) {
  try {
    if (await isInJail()) return;
    const u = uid(); if (!u) return;
    const myRef = doc(db, "users", u);
    const mySnap = await getDoc(myRef); const me = mySnap.data();
    const tRef = doc(db, "users", n.target);
    const tSnap = await getDoc(tRef); const tgt = tSnap.data();
    if (!tgt) return toast("Hedef yok.");

    if (tgt.hiding && tgt.hidingUntil > Date.now()) return toast("🚫 Hedef saklanıyor! Evini bul.");

    const myWeapon = getBestWeapon(me.inventory || {});
    const bonus = { dov:0, yarala:2, agir:4, oldur:6 }[plan.type] || 0;
    const myPower = (myWeapon.power || 1) + bonus + rnd(1, 10);

    const tgtWeapon = getBestWeapon(tgt.inventory || {});
    let tgtPower = (tgtWeapon.power || 1) + rnd(1, 10);
    if (tgt.health >= 40) tgtPower += 2;
    if (tgt.energy >= 80) tgtPower += 2;
    if (hasItem(tgt.inventory || {}, "kacisArabasi")) tgtPower += 3;

    const kazandi = myPower > tgtPower;

    if (kazandi) {
      let nakit = 0, envY = 0, can = 0;
      if (plan.type==="dov") { nakit=Math.floor((tgt.cash||0)*0.30); envY=0; can=10; }
      else if (plan.type==="yarala") { nakit=Math.floor((tgt.cash||0)*0.50); envY=0.25; can=25; }
      else if (plan.type==="agir") { nakit=Math.floor((tgt.cash||0)*0.70); envY=0.50; can=40; }
      else { nakit=tgt.cash||0; envY=1.0; can=999; }

      const calinan = {};
      Object.keys(tgt.inventory || {}).forEach(k => {
        const c = Math.floor(tgt.inventory[k] * envY);
        if (c > 0) calinan[k] = c;
      });
      const kalanEnv = plan.type === "oldur" ? {} : Object.keys(tgt.inventory || {}).reduce((a,k)=>{
        const kalan = tgt.inventory[k] - Math.floor(tgt.inventory[k]*envY);
        if (kalan > 0) a[k] = kalan;
        return a;
      }, {});

      const yeniCan = plan.type === "oldur" ? 0 : Math.max(0, (tgt.health||50) - can);
      const hapis = plan.type === "oldur" ? Date.now()+60*60*1000 : Date.now()+15*60*1000;

      await updateDoc(tRef, { cash: Math.max(0, (tgt.cash||0)-nakit), inventory: kalanEnv, health: yeniCan, wanted: Math.min(100,(tgt.wanted||0)+30), jailUntil: hapis });

      // Saldıran hasar alır (4=A)
      const hasar = plan.type==="oldur"?30:plan.type==="agir"?20:plan.type==="yarala"?10:5;
      const yeniEnvM = { ...(me.inventory||{}) };
      Object.keys(calinan).forEach(k => { yeniEnvM[k] = (yeniEnvM[k]||0) + calinan[k]; });
      const yeniCanM = Math.max(1, (me.health||50) - hasar);

      await updateDoc(myRef, {
        cash: (me.cash||0)+nakit, inventory: yeniEnvM, health: yeniCanM,
        wanted: Math.min(100, (me.wanted||0) + (plan.type==="oldur"?40:20)),
        jailUntil: Date.now() + plan.jail*60*1000
      });

      toast(`✅ Kazandın! +${nakit.toLocaleString()} TL, -${hasar} can.`);
      await addNotification(n.target, { type:"info", text:`🚨 ${me.name} sana saldırdı! ${plan.type==="oldur"?"ÖLDÜN.":`-${nakit.toLocaleString()} TL`}` });
      tgLog(`⚔️ <b>SALDIRI</b>\n${me.name} → ${tgt.name}\nKazanan: ${me.name}`);
    } else {
      let nakit = 0, envY = 0, can = 0;
      if (plan.type==="dov") { nakit=Math.floor((me.cash||0)*0.30); envY=0; can=10; }
      else if (plan.type==="yarala") { nakit=Math.floor((me.cash||0)*0.50); envY=0.25; can=25; }
      else if (plan.type==="agir") { nakit=Math.floor((me.cash||0)*0.70); envY=0.50; can=40; }
      else { nakit=me.cash||0; envY=1.0; can=999; }

      const calinan = {};
      Object.keys(me.inventory||{}).forEach(k => { const c=Math.floor(me.inventory[k]*envY); if(c>0) calinan[k]=c; });
      const kalanEnv = plan.type==="oldur"?{}:Object.keys(me.inventory||{}).reduce((a,k)=>{
        const kalan = me.inventory[k] - Math.floor(me.inventory[k]*envY);
        if (kalan>0) a[k]=kalan; return a;
      },{});
      const tEnv = { ...(tgt.inventory||{}) };
      Object.keys(calinan).forEach(k => { tEnv[k] = (tEnv[k]||0)+calinan[k]; });

      const yeniCan = plan.type==="oldur"?0:Math.max(0,(me.health||50)-can);
      await updateDoc(myRef, { cash: Math.max(0,(me.cash||0)-nakit), inventory: kalanEnv, health: yeniCan, wanted: Math.min(100,(me.wanted||0)+25), jailUntil: plan.type==="oldur"?Date.now()+60*60*1000:Date.now()+20*60*1000 });
      await updateDoc(tRef, { cash: (tgt.cash||0)+nakit, inventory: tEnv, wanted: Math.min(100,(tgt.wanted||0)+5) });

      toast(`❌ Kaybettin! -${nakit.toLocaleString()} TL`);
      await addNotification(n.target, { type:"info", text:`🛡️ ${me.name} sana saldırdı ama kazandın!` });
      tgLog(`⚔️ <b>SALDIRI</b>\n${me.name} → ${tgt.name}\nKazanan: ${tgt.name}`);
    }
    await refreshAll();
  } catch(e){ toast("Saldırı: " + e.message); }
}

/* SUÇ İŞLEME */
async function attemptCrime(crimeId) {
  try {
    if (await isInJail() || await isHiding()) return;
    const u = uid(); if (!u) return;
    const crime = CRIMES.find(c => c.id === crimeId);
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    const inv = d.inventory || {};
    if (!hasAny(inv, crime.requires)) {
      const gerekli = crime.requires.map(k => ITEMS[k] ? ITEMS[k].icon + " " + ITEMS[k].name : k).join(" veya ");
      return toast("❌ Gerekli: " + gerekli);
    }
    const bestKey = getBestWeapon(inv).key;
    openModal(`${crime.icon} ${crime.name}`, `En iyi: ${bestKey ? ITEMS[bestKey].icon + " " + ITEMS[bestKey].name : "-"}`, crime.plans, async (plan) => {
      await executeCrime(crime, plan, d, ref);
    });
  } catch(e){ toast("Hata: " + e.message); }
}

async function executeCrime(crime, plan, d, ref) {
  try {
    const inv = d.inventory || {};
    let risk = plan.risk, gain = 1.0, wMult = 1.0;
    Object.keys(inv).forEach(k => {
      if (!hasItem(inv, k)) return;
      const it = ITEMS[k]; if (!it || !it.efekt) return;
      const glob = ["maske","eldiven","kacisArabasi","jammer"].includes(k);
      const req = crime.requires.includes(k);
      if (glob || req) {
        if (it.efekt.risk) risk += it.efekt.risk;
        if (it.efekt.gain) gain += it.efekt.gain;
        if (it.efekt.wanted) wMult += it.efekt.wanted;
      }
    });
    risk = Math.max(0.05, Math.min(0.98, risk));

    if (plan.bribe) {
      if (d.cash < plan.bribe) return toast("Rüşvet için para yok.");
      await updateDoc(ref, { cash: d.cash - plan.bribe });
      d.cash -= plan.bribe;
    }

    const basarili = Math.random() > risk;
    const yeniWanted = Math.min(100, (d.wanted||0) + Math.round((basarili?8:25)*wMult));

    if (basarili) {
      const kazanc = Math.round(rnd(plan.min, plan.max) * gain);
      let ekHapis = 0;
      let msg = `✅ Başarılı! +${kazanc.toLocaleString()} TL`;
      if (yeniWanted >= 100) { ekHapis = 15*60*1000; msg = `✅ +${kazanc.toLocaleString()} TL (aranma 100 → 15 dk hapis)`; }
      await updateDoc(ref, { cash: d.cash + kazanc, wanted: yeniWanted, jailUntil: ekHapis ? Date.now()+ekHapis : (d.jailUntil||0) });
      toast(msg);
      log(`${crime.icon} ${crime.name} [${plan.name}]: +${kazanc} TL`);
      if (ekHapis) startJailCheck();
    } else {
      const ceza = Math.round(rnd(plan.min, plan.max) * 0.5);
      await updateDoc(ref, { cash: Math.max(0, d.cash-ceza), wanted: yeniWanted, jailUntil: Date.now() + plan.jail*60*1000 });
      toast(`🚨 Yakalandın! -${ceza.toLocaleString()} TL, ${plan.jail} dk hapis.`);
      log(`${crime.icon} ${crime.name}: YAKALANDI`);
      startJailCheck();
    }
    await refreshAll();
  } catch(e){ toast("Hata: " + e.message); }
}

/* BORSA */
async function buyCoin(symbol, amountTry) {
  try {
    if (await isInJail() || await isHiding()) return;
    const u = uid(); if (!u) return;
    const prices = await getMarket();
    const price = prices[symbol] || BASE_PRICE[symbol];
    const adet = +(amountTry / price).toFixed(8);
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    if (d.cash < amountTry) return toast("Yetersiz nakit.");
    const portfolio = d.portfolio || {};
    const cur = portfolio[symbol] || { amount:0, avg:0 };
    const yeniAdet = cur.amount + adet;
    const yeniOrt = ((cur.avg*cur.amount)+(price*adet))/yeniAdet;
    portfolio[symbol] = { amount:+yeniAdet.toFixed(8), avg:+yeniOrt.toFixed(6) };
    await updateDoc(ref, { cash: d.cash - amountTry, portfolio });
    toast(`${symbol} alındı`);
    await refreshAll();
  } catch(e){ toast("Hata: " + e.message); }
}
async function sellCoin(symbol, adet) {
  try {
    if (await isInJail() || await isHiding()) return;
    const u = uid(); if (!u) return;
    const prices = await getMarket();
    const price = prices[symbol] || BASE_PRICE[symbol];
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    const portfolio = d.portfolio || {};
    const cur = portfolio[symbol];
    if (!cur || cur.amount < adet) return toast("Yetersiz coin.");
    const gelir = +(adet*price).toFixed(2);
    cur.amount = +(cur.amount - adet).toFixed(8);
    if (cur.amount <= 0) delete portfolio[symbol];
    await updateDoc(ref, { cash: d.cash + gelir, portfolio });
    toast(`+${gelir} TL`);
    await refreshAll();
  } catch(e){ toast("Hata: " + e.message); }
}

/* İŞ */
async function work(jobId) {
  try {
    if (await isInJail() || await isHiding()) return;
    const u = uid(); if (!u) return;
    const job = JOBS.find(j => j.id === jobId);
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    if (d.energy < 10) return toast("Enerjin yok.");
    let pay = job.pay;
    const kaza = Math.random() < job.risk;
    if (kaza) pay = Math.floor(pay*0.3);
    await updateDoc(ref, { cash: d.cash + pay, energy: Math.max(0, d.energy-10), health: Math.max(0, d.health - (kaza?5:0)) });
    toast(`+${pay} TL`);
    await refreshAll();
  } catch(e){ toast("Hata: " + e.message); }
}

/* MÜLK */
async function buyAsset(assetId) {
  try {
    if (await isInJail() || await isHiding()) return;
    const u = uid(); if (!u) return;
    const a = ASSETS.find(x => x.id === assetId);
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    if (d.cash < a.price) return toast("Yetersiz nakit.");
    const assets = d.assets || [];
    assets.push({ id:a.id, name:a.name, buyPrice:a.price, income:a.income, shelter:a.shelter||false, shelterMin:a.shelterMin||0, buyAt:Date.now() });
    await updateDoc(ref, { cash: d.cash - a.price, assets });
    toast(`${a.name} alındı!`);
    await refreshAll();
  } catch(e){ toast("Hata: " + e.message); }
}

/* BANKA */
async function takeLoan(amount) {
  try {
    if (await isInJail() || await isHiding()) return;
    const u = uid(); if (!u) return;
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    if ((d.debt||0)+amount > 50000) return toast("Kredi limiti 50K.");
    await updateDoc(ref, { cash: d.cash + amount, debt: (d.debt||0) + Math.floor(amount*1.2) });
    toast(`+${amount} TL kredi`);
    await refreshAll();
  } catch(e){ toast("Hata: " + e.message); }
}
async function payDebt(amount) {
  try {
    if (await isInJail()) return;
    const u = uid(); if (!u) return;
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    if (d.cash < amount) return toast("Yetersiz nakit.");
    const yeni = Math.max(0, (d.debt||0)-amount);
    await updateDoc(ref, { cash: d.cash-amount, debt: yeni });
    toast("Borç ödendi");
    await refreshAll();
  } catch(e){ toast("Hata: " + e.message); }
}

/* HASTANE / YEMEK */
async function heal() {
  try {
    if (await isInJail() || await isHiding()) return;
    const u = uid(); if (!u) return;
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    if (d.cash < 500) return toast("Yetersiz nakit.");
    if (d.health >= 50) return toast("Canın tam.");
    await updateDoc(ref, { cash: d.cash - 500, health: Math.min(50, (d.health||0)+30) });
    toast("+30 can");
    await refreshAll();
  } catch(e){ toast("Hata: " + e.message); }
}
async function eat() {
  try {
    if (await isInJail() || await isHiding()) return;
    const u = uid(); if (!u) return;
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    if (d.cash < 200) return toast("Yetersiz nakit.");
    if (d.energy >= 100) return toast("Enerjin tam.");
    await updateDoc(ref, { cash: d.cash - 200, energy: Math.min(100, (d.energy||0)+20) });

/* PASİF */
async function tickEffects() {
  try {
    const u = uid(); if (!u) return;
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref); const d = snap.data();
    if (!d) return;
    const now = Date.now();
    let updates = {};

    const sonH = d.lastHealthTick || now;
    if (now - sonH >= 5*60*1000) {
      const artis = Math.floor((now - sonH) / (5*60*1000));
      updates.health = Math.min(d.maxHealth||50, (d.health||0) + artis);
      updates.lastHealthTick = now;
    }

    const sonI = d.lastIncome || now;
    if (now - sonI >= 5*60*1000) {
      let toplam = 0;
      (d.assets||[]).forEach(a => { toplam += (a.income||0); });
      if (toplam > 0) updates.cash = (d.cash||0) + toplam;
      updates.lastIncome = now;
    }

    updates.energy = Math.min(100, (d.energy||0) + 1);
    await updateDoc(ref, updates);
  } catch(e){}
}

async function refreshRanking() {
  try {
    const q = query(collection(db,"users"), orderBy("cash","desc"), limit(20));
    const s = await getDocs(q);
    const box = $("rankingBox"); box.innerHTML = "";
    let i = 1;
    s.forEach(docu => {
      const d = docu.data();
      const row = document.createElement("div"); row.className = "row";
      const renk = i===1?"yellow":i===2?"blue":i===3?"green":"";
      const mad = i===1?"🥇":i===2?"🥈":i===3?"🥉":"";
      row.innerHTML = `<span class="${renk}">${mad} #${i} ${d.name}${d.hiding && d.hidingUntil>Date.now()?' 🥷':''}</span><span>${Math.floor(d.cash||0).toLocaleString()} TL</span>`;
      box.appendChild(row); i++;
    });
  } catch(e){}
}

/* ANA REFRESH */
async function refreshAll() {
  try {
    const u = uid(); if (!u) return;
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref);
    if (!snap.exists()) { await ensureUserDoc(auth.currentUser); return; }
    const d = snap.data(); if (!d) return;
    currentUserData = d;
    const prices = await getMarket() || BASE_PRICE;
    const inv = d.inventory || {};
    const hiding = d.hiding && d.hidingUntil > Date.now();
    const isJail = d.jailUntil && d.jailUntil > Date.now();

    $("statusBox").innerHTML = `
      <div class="row"><span class="label">💵 Nakit</span><span class="value green">${Math.floor(d.cash||0).toLocaleString()} TL</span></div>
      <div class="row"><span class="label">🏦 Borç</span><span class="value red">${Math.floor(d.debt||0).toLocaleString()} TL</span></div>
      <div class="row"><span class="label">❤️ Can</span><span class="value ${d.health<=15?'red':''}">${d.health||0}/${d.maxHealth||50}</span></div>
      <div class="row"><span class="label">⚡ Enerji</span><span class="value yellow">${d.energy||0}/100</span></div>
      <div class="row"><span class="label">🚨 Aranma</span><span class="value red">${d.wanted||0}/100</span></div>
      <div class="row"><span class="label">🔒 Hapis</span><span class="value ${isJail?"red":"green"}">${isJail?"EVET":"hayır"}</span></div>
      <div class="row"><span class="label">🥷 Saklanma</span><span class="value blue">${hiding?"EVET — "+(d.hidingIn||""):"hayır"}</span></div>`;

    const ml = $("marketList"); ml.innerHTML = "";
    COINS.forEach(c => {
      const f = prices[c] || BASE_PRICE[c];
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">📈 ${c}</span><span class="value">${f}</span>`;
      const b = document.createElement("button"); b.className="buy"; b.textContent="AL 100"; b.onclick=()=>buyCoin(c,100);
      const s = document.createElement("button"); s.className="sell"; s.textContent="SAT"; s.onclick=()=>sellCoin(c,0.001);
      row.appendChild(b); row.appendChild(s); ml.appendChild(row);
    });

    const al = $("assetList"); al.innerHTML = "";
    const port = d.portfolio || {};
    let bos = true;
    Object.keys(port).forEach(k => {
      bos = false;
      const v = port[k]; const f = prices[k] || BASE_PRICE[k];
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">💰 ${k}: ${v.amount}</span><span class="value green">${(v.amount*f).toFixed(2)} TL</span>`;
      al.appendChild(row);
    });
    (d.assets||[]).forEach(a => {
      bos = false;
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">${a.name}${a.shelter?' 🥷':''}</span><span class="value">+${a.income||0}/5dk</span>`;
      al.appendChild(row);
    });
    if (bos) al.innerHTML = `<div class="row"><span class="label" style="color:#556080;">Boş</span></div>`;

    const jl = $("jobList"); jl.innerHTML = "";
    JOBS.forEach(j => {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">${j.icon} ${j.name}</span><span class="value green">+${j.pay}</span>`;
      const b = document.createElement("button"); b.className="work"; b.textContent="ÇALIŞ"; b.onclick=()=>work(j.id);
      row.appendChild(b); jl.appendChild(row);
    });

    const cl = $("crimeBox"); cl.innerHTML = "";
    CRIMES.forEach(c => {
      const ok = hasAny(inv, c.requires);
      const row = document.createElement("div"); row.className = "row"+(ok?"":" locked");
      const gerekli = c.requires.map(k => ITEMS[k] ? ITEMS[k].icon + " " + ITEMS[k].name : k).join(" / ");
      row.innerHTML = `<span class="label">${c.icon} ${c.name}<br><span style="font-size:9px;color:#556080;">${gerekli}</span></span>`;
      const b = document.createElement("button"); b.className="crime"; b.textContent = ok?"SOY":"🔒";
      b.disabled = !ok; b.onclick = () => attemptCrime(c.id);
      row.appendChild(b); cl.appendChild(row);
    });

    await renderPlayers();

    const db2 = $("detectiveBox"); db2.innerHTML = "";
    const saklananlar = allPlayers.filter(p => p.hiding && p.hidingUntil > Date.now());
    if (saklananlar.length === 0) db2.innerHTML = `<div class="row"><span class="label" style="color:#556080;">Saklanan yok</span></div>`;
    else saklananlar.forEach(p => {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">🥷 ${p.name} → ${p.hidingIn || "?"}</span>`;
      const b = document.createElement("button"); b.className="attack"; b.textContent = "🕵️ BUL ("+DETECTIVE_COST.toLocaleString()+")";
      b.onclick = () => findHouse(p.id, p.name);
      row.appendChild(b); db2.appendChild(row);
    });

    const hb = $("hideBox"); hb.innerHTML = "";
    if (hiding) {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">🥷 Saklanıyorsun: ${d.hidingIn}</span>`;
      const b = document.createElement("button"); b.textContent="ÇIK"; b.onclick = stopHiding;
      row.appendChild(b); hb.appendChild(row);
    } else {
      const r1 = document.createElement("div"); r1.className = "row";
      r1.innerHTML = `<span class="label">🌲 Sokakta saklan (10 dk)</span>`;
      const b1 = document.createElement("button"); b1.textContent="SAKLAN"; b1.onclick=()=>startHiding(10,"Sokak");
      r1.appendChild(b1); hb.appendChild(r1);
      (d.assets||[]).forEach(a => {
        if (a.shelter) {
          const r = document.createElement("div"); r.className = "row";
          r.innerHTML = `<span class="label">${a.name} (${a.shelterMin} dk)</span>`;
          const b = document.createElement("button"); b.className="buy"; b.textContent="SAKLAN";
          b.onclick = () => startHiding(a.shelterMin, a.name);
          r.appendChild(b); hb.appendChild(r);
        }
      });
    }

    const sb = $("shopBox"); sb.innerHTML = "";
    Object.keys(ITEMS).forEach(k => {
      const it = ITEMS[k];
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">${it.icon} ${it.name}<br><span style="font-size:9px;color:#556080;">${it.desc}${it.power?' • Güç:'+it.power:''}</span></span><span class="value">${it.price.toLocaleString()}</span>`;
      const b = document.createElement("button"); b.className="buy"; b.textContent="AL"; b.onclick=()=>buyItem(k);
      row.appendChild(b); sb.appendChild(row);
    });

    const ib = $("invBox"); ib.innerHTML = "";
    let invBos = true;
    Object.keys(inv).forEach(k => {
      if (inv[k] > 0 && ITEMS[k]) {
        invBos = false;
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = `<span class="label">${ITEMS[k].icon} ${ITEMS[k].name}</span><span class="value">x${inv[k]}</span>`;
        ib.appendChild(row);
      }
    });
    if (invBos) ib.innerHTML = `<div class="row"><span class="label" style="color:#556080;">Boş</span></div>`;

    const ab = $("assetBuyBox"); ab.innerHTML = "";
    ASSETS.forEach(a => {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">${a.icon} ${a.name}${a.shelter?' 🥷':''}<br><span style="font-size:9px;color:#556080;">+${a.income}/5dk${a.shelter?' • '+a.shelterMin+'dk':''}</span></span><span class="value">${a.price.toLocaleString()}</span>`;
      const b = document.createElement("button"); b.className="buy"; b.textContent="AL"; b.onclick=()=>buyAsset(a.id);
      row.appendChild(b); ab.appendChild(row);
    });

    const hhb = $("healthBox"); hhb.innerHTML = "";
    const r1 = document.createElement("div"); r1.className = "row";
    r1.innerHTML = `<span class="label">🏥 Hastane (+30 can)</span><span class="value">500 TL</span>`;
    const b1 = document.createElement("button"); b1.className="buy"; b1.textContent="GİT"; b1.onclick=heal;
    r1.appendChild(b1); hhb.appendChild(r1);
    const r2 = document.createElement("div"); r2.className = "row";
    r2.innerHTML = `<span class="label">🍔 Yemek (+20 enerji)</span><span class="value">200 TL</span>`;
    const b2 = document.createElement("button"); b2.className="buy"; b2.textContent="YE"; b2.onclick=eat;
    r2.appendChild(b2); hhb.appendChild(r2);

    const cb = $("creditBox"); cb.innerHTML = "";
    const l1 = document.createElement("button"); l1.className="work"; l1.textContent="💵 10K KREDİ ÇEK"; l1.style.width="100%"; l1.onclick=()=>takeLoan(10000);
    const l2 = document.createElement("button"); l2.className="buy"; l2.textContent="💸 10K BORÇ ÖDE"; l2.style.marginTop="6px"; l2.style.width="100%"; l2.onclick=()=>payDebt(10000);
    cb.appendChild(l1); cb.appendChild(l2);

    await refreshRanking();
    await renderNotifications();
    if (isAdmin) loadAdminPanel();
  } catch(e) {
    alert("refreshAll: " + e.message);
    console.error(e);
  }
}

/* ADMIN PANEL GENİŞLETİLMİŞ */
$("admClose").onclick = () => { $("adminPanel").style.display = "none"; };

async function loadAdminPanel() {
  try {
    const q = query(collection(db,"users"), orderBy("cash","desc"), limit(50));
    const s = await getDocs(q);
    const box = $("admUsers"); box.innerHTML = "";
    s.forEach(docu => {
      const d = docu.data();
      const row = document.createElement("div"); row.className = "adm-row";
      const isAdm = d.isAdmin ? "👑 " : "";
      row.innerHTML = `<span style="flex:1 1 100%;font-size:10px;color:${d.banned?'#e53935':'#888'}">${isAdm}${d.name||"?"} | ${Math.floor(d.cash||0).toLocaleString()} TL | ❤️${d.health||0} ⚡${d.energy||0} 🚨${d.wanted||0}${d.hiding&&d.hidingUntil>Date.now()?' 🥷':''}</span>`;
      const inp = document.createElement("input"); inp.placeholder="TL"; inp.type="number";

      // +para
      const bAdd = document.createElement("button"); bAdd.textContent="+₺";
      bAdd.onclick = async () => {
        const v = parseInt(inp.value); if (!v) return;
        await updateDoc(doc(db,"users",docu.id), { cash: (d.cash||0)+v });
        toast(`+${v} TL → ${d.name}`); loadAdminPanel();
      };
      // -para
      const bSub = document.createElement("button"); bSub.textContent="−₺";
      bSub.onclick = async () => {
        const v = parseInt(inp.value); if (!v) return;
        await updateDoc(doc(db,"users",docu.id), { cash: Math.max(0,(d.cash||0)-v) });
        toast(`-${v} TL → ${d.name}`); loadAdminPanel();
      };
      // +can
      const bHp = document.createElement("button"); bHp.textContent="❤️";
      bHp.title="Can 50";
      bHp.onclick = async () => {
        await updateDoc(doc(db,"users",docu.id), { health: 50, maxHealth: 50 });
        toast(`Can 50 → ${d.name}`); loadAdminPanel();
      };
      // +enerji
      const bEn = document.createElement("button"); bEn.textContent="⚡";
      bEn.title="Enerji 100";
      bEn.onclick = async () => {
        await updateDoc(doc(db,"users",docu.id), { energy: 100 });
        toast(`Enerji 100 → ${d.name}`); loadAdminPanel();
      };
      // hapisten çıkar
      const bUJ = document.createElement("button"); bUJ.textContent="🔓";
      bUJ.title="Hapisten çıkar";
      bUJ.onclick = async () => {
        await updateDoc(doc(db,"users",docu.id), { jailUntil: 0 });
        toast(`Hapis bitti → ${d.name}`); loadAdminPanel();
      };
      // aranma sıfırla
      const bW = document.createElement("button"); bW.textContent="🚨";
      bW.title="Aranma sıfırla";
      bW.onclick = async () => {
        await updateDoc(doc(db,"users",docu.id), { wanted: 0 });
        toast(`Aranma 0 → ${d.name}`); loadAdminPanel();
      };
      // borç sıfırla
      const bD = document.createElement("button"); bD.textContent="🏦";
      bD.title="Borç sıfırla";
      bD.onclick = async () => {
        await updateDoc(doc(db,"users",docu.id), { debt: 0 });
        toast(`Borç 0 → ${d.name}`); loadAdminPanel();
      };
      // envanter temizle
      const bI = document.createElement("button"); bI.textContent="🎒";
      bI.title="Envanter temizle";
      bI.onclick = async () => {
        if (!confirm(`${d.name} envanterini sil?`)) return;
        await updateDoc(doc(db,"users",docu.id), { inventory: {} });
        toast(`Envanter silindi → ${d.name}`); loadAdminPanel();
      };
      // mülkleri sil
      const bAs = document.createElement("button"); bAs.textContent="🏪";
      bAs.title="Mülkleri sil";
      bAs.onclick = async () => {
        if (!confirm(`${d.name} mülklerini sil?`)) return;
        await updateDoc(doc(db,"users",docu.id), { assets: [] });
        toast(`Mülkler silindi → ${d.name}`); loadAdminPanel();
      };
      // hapis at (30 dk)
      const bJail = document.createElement("button"); bJail.textContent="🔒";
      bJail.title="30 dk hapis";
      bJail.onclick = async () => {
        await updateDoc(doc(db,"users",docu.id), { jailUntil: Date.now() + 30*60*1000 });
        toast(`30 dk hapis → ${d.name}`); loadAdminPanel();
      };
      // ban
      const bBan = document.createElement("button");
      bBan.textContent = d.banned ? "UNBAN" : "BAN";
      bBan.onclick = async () => {
        await updateDoc(doc(db,"users",docu.id), { banned: !d.banned });
        toast(`${d.banned?"Unban":"Ban"}: ${d.name}`); loadAdminPanel();
      };

      row.appendChild(inp);
      row.appendChild(bAdd); row.appendChild(bSub);
      row.appendChild(bHp); row.appendChild(bEn);
      row.appendChild(bUJ); row.appendChild(bW); row.appendChild(bD);
      row.appendChild(bI); row.appendChild(bAs); row.appendChild(bJail);
      row.appendChild(bBan);
      box.appendChild(row);
    });
  } catch(e) { alert("Admin: " + e.message); }
}
