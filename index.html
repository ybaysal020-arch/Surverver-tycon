/* MARKET */
async function getMarket(){
  const ref=doc(db,"market","global");
  const snap=await getDoc(ref);
  if(!snap.exists()){
    const prices={};COINS.forEach(c=>prices[c]=BASE_PRICE[c]);
    await setDoc(ref,{prices,day:1,updatedAt:Date.now()});
    return prices;
  }
  return snap.data().prices||BASE_PRICE;
}

/* HAPİS */
function startJailCheck(){
  if(jailInterval)clearInterval(jailInterval);
  jailInterval=setInterval(async()=>{
    if(!currentUid)return;
    try{
      const snap=await getDoc(doc(db,"users",currentUid));
      const d=snap.data();if(!d)return;
      const jail=d.jailUntil||0;const now=Date.now();
      if(jail>now){
        $("jailBanner").classList.add("show");
        const k=Math.floor((jail-now)/1000);
        $("jailTimer").textContent=`${Math.floor(k/60)}:${(k%60).toString().padStart(2,"0")}`;
      }else $("jailBanner").classList.remove("show");
    }catch(e){}
  },1000);
}
async function isInJail(){
  if(!currentUid)return false;
  const snap=await getDoc(doc(db,"users",currentUid));
  const d=snap.data();if(!d)return false;
  if(d.jailUntil&&d.jailUntil>Date.now()){toast("🔒 Hapistesin!");return true}
  return false;
}

/* SAKLANMA */
function startHideCheck(){
  if(hideInterval)clearInterval(hideInterval);
  hideInterval=setInterval(async()=>{
    if(!currentUid)return;
    try{
      const snap=await getDoc(doc(db,"users",currentUid));
      const d=snap.data();if(!d)return;
      const hu=d.hidingUntil||0;const now=Date.now();
      if(d.hiding&&hu>now){
        $("hideBanner").classList.add("show");
        const k=Math.floor((hu-now)/1000);
        $("hideTimer").textContent=`${Math.floor(k/60)}:${(k%60).toString().padStart(2,"0")} (${d.hidingIn||"sokak"})`;
      }else{
        $("hideBanner").classList.remove("show");
        if(d.hiding)await updateDoc(doc(db,"users",currentUid),{hiding:false});
      }
    }catch(e){}
  },1000);
}
async function startHiding(minutes,where){
  try{
    if(await isInJail())return;
    if(!currentUid)return;
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    if(d.hiding&&d.hidingUntil>Date.now())return toast("Zaten saklanıyorsun.");
    await updateDoc(ref,{hiding:true,hidingUntil:Date.now()+minutes*60*1000,hidingIn:where});
    toast(`🥷 ${where} (${minutes} dk)`);
  }catch(e){}
}
async function stopHiding(){
  if(!currentUid)return;
  await updateDoc(doc(db,"users",currentUid),{hiding:false,hidingUntil:0});
  toast("Saklanma bitti.");
}
async function isHiding(){
  if(!currentUid)return false;
  const snap=await getDoc(doc(db,"users",currentUid));
  const d=snap.data();
  return d&&d.hiding&&d.hidingUntil>Date.now();
}

/* OYUNCULAR */
async function loadPlayers(){
  try{
    const q=query(collection(db,"users"),orderBy("cash","desc"),limit(50));
    const s=await getDocs(q);
    allPlayers=[];
    s.forEach(docu=>{if(docu.id===currentUid)return;allPlayers.push({id:docu.id,...docu.data()})});
    return allPlayers;
  }catch(e){return []}
}

/* İŞ */
async function work(jobId){
  try{
    if(await isInJail()||await isHiding())return;
    if(!currentUid)return;
    const job=JOBS.find(j=>j.id===jobId);
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    if(d.energy<10)return toast("Enerjin yok.");
    let pay=job.pay;
    const kaza=Math.random()<job.risk;
    if(kaza)pay=Math.floor(pay*0.3);
    await updateDoc(ref,{cash:d.cash+pay,energy:Math.max(0,d.energy-10),health:Math.max(0,d.health-(kaza?5:0))});
    toast(`+${pay} TL`);
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}

/* SUÇ */
async function attemptCrime(crimeId){
  try{
    if(await isInJail()||await isHiding())return;
    if(!currentUid)return;
    const crime=CRIMES.find(c=>c.id===crimeId);
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    const inv=d.inventory||{};
    if(!hasAny(inv,crime.requires)){
      const g=crime.requires.map(k=>ITEMS[k]?ITEMS[k].icon+" "+ITEMS[k].name:k).join(" veya ");
      return toast("❌ Gerekli: "+g);
    }
    // Modal yerine direkt en iyi planı seç (basitlik için)
    const plan=crime.plans[0];
    const basarili=Math.random()>plan.risk;
    const yeniWanted=Math.min(100,(d.wanted||0)+(basarili?8:25));
    if(basarili){
      const kazanc=rnd(plan.min,plan.max);
      let ekHapis=0;
      let msg=`✅ +${kazanc.toLocaleString()} TL`;
      if(yeniWanted>=100){ekHapis=15*60*1000;msg=`✅ +${kazanc} TL (aranma 100 → hapis)`}
      await updateDoc(ref,{cash:d.cash+kazanc,wanted:yeniWanted,jailUntil:ekHapis?Date.now()+ekHapis:(d.jailUntil||0)});
      toast(msg);
      log(`${crime.icon} ${crime.name}: +${kazanc} TL`);
      if(ekHapis)startJailCheck();
    }else{
      const ceza=Math.floor(plan.min*0.5);
      await updateDoc(ref,{cash:Math.max(0,d.cash-ceza),wanted:yeniWanted,jailUntil:Date.now()+plan.jail*60*1000});
      toast(`🚨 Yakalandın! -${ceza} TL, ${plan.jail} dk hapis.`);
      startJailCheck();
    }
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}

/* MAĞAZA */
async function buyItem(k){
  try{
    if(await isInJail()||await isHiding())return;
    if(!currentUid)return;
    const it=ITEMS[k];
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    if(d.cash<it.price)return toast("Yetersiz nakit.");
    const inv=d.inventory||{};
    inv[k]=(inv[k]||0)+1;
    await updateDoc(ref,{cash:d.cash-it.price,inventory:inv});
    toast(`✅ ${it.icon} ${it.name} alındı`);
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}

/* BORSA */
async function buyCoin(symbol,amountTry){
  try{
    if(await isInJail()||await isHiding())return;
    if(!currentUid)return;
    const prices=await getMarket();
    const price=prices[symbol]||BASE_PRICE[symbol];
    const adet=+(amountTry/price).toFixed(8);
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    if(d.cash<amountTry)return toast("Yetersiz nakit.");
    const portfolio=d.portfolio||{};
    const cur=portfolio[symbol]||{amount:0,avg:0};
    const yA=cur.amount+adet;
    const yO=((cur.avg*cur.amount)+(price*adet))/yA;
    portfolio[symbol]={amount:+yA.toFixed(8),avg:+yO.toFixed(6)};
    await updateDoc(ref,{cash:d.cash-amountTry,portfolio});
    toast(`${symbol} alındı`);
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}
async function sellCoin(symbol,adet){
  try{
    if(await isInJail()||await isHiding())return;
    if(!currentUid)return;
    const prices=await getMarket();
    const price=prices[symbol]||BASE_PRICE[symbol];
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    const portfolio=d.portfolio||{};
    const cur=portfolio[symbol];
    if(!cur||cur.amount<adet)return toast("Yetersiz.");
    const gelir=+(adet*price).toFixed(2);
    cur.amount=+(cur.amount-adet).toFixed(8);
    if(cur.amount<=0)delete portfolio[symbol];
    await updateDoc(ref,{cash:d.cash+gelir,portfolio});
    toast(`+${gelir} TL`);
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}

/* MÜLK */
async function buyAsset(id){
  try{
    if(await isInJail()||await isHiding())return;
    if(!currentUid)return;
    const a=ASSETS.find(x=>x.id===id);
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    if(d.cash<a.price)return toast("Yetersiz nakit.");
    const assets=d.assets||[];
    assets.push({id:a.id,name:a.name,buyPrice:a.price,income:a.income,shelter:a.shelter||false,shelterMin:a.shelterMin||0,buyAt:Date.now()});
    await updateDoc(ref,{cash:d.cash-a.price,assets});
    toast(`${a.name} alındı!`);
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}

/* BANKA */
async function takeLoan(amount){
  try{
    if(await isInJail()||await isHiding())return;
    if(!currentUid)return;
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    if((d.debt||0)+amount>50000)return toast("Limit 50K.");
    await updateDoc(ref,{cash:d.cash+amount,debt:(d.debt||0)+Math.floor(amount*1.2)});
    toast(`+${amount} TL`);
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}
async function payDebt(amount){
  try{
    if(await isInJail())return;
    if(!currentUid)return;
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    if(d.cash<amount)return toast("Yetersiz.");
    await updateDoc(ref,{cash:d.cash-amount,debt:Math.max(0,(d.debt||0)-amount)});
    toast("Ödendi");
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}

/* SAĞLIK */
async function heal(){
  try{
    if(await isInJail()||await isHiding())return;
    if(!currentUid)return;
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    if(d.cash<500)return toast("Yetersiz.");
    if(d.health>=50)return toast("Canın tam.");
    await updateDoc(ref,{cash:d.cash-500,health:Math.min(50,(d.health||0)+30)});
    toast("+30 can");
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}
async function eat(){
  try{
    if(await isInJail()||await isHiding())return;
    if(!currentUid)return;
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);const d=snap.data();
    if(d.cash<200)return toast("Yetersiz.");
    if(d.energy>=100)return toast("Enerjin tam.");
    await updateDoc(ref,{cash:d.cash-200,energy:Math.min(100,(d.energy||0)+20)});
    toast("+20 enerji");
    await refreshAll();
  }catch(e){toast("Hata: "+e.message)}
}

/* SIRALAMA */
async function refreshRanking(){
  try{
    const q=query(collection(db,"users"),orderBy("cash","desc"),limit(20));
    const s=await getDocs(q);
    const box=$("rankingBox");box.innerHTML="";
    let i=1;
    s.forEach(docu=>{
      const d=docu.data();
      const row=document.createElement("div");row.className="row";
      const mad=i===1?"🥇":i===2?"🥈":i===3?"🥉":"";
      row.innerHTML=`<span>${mad} #${i} ${d.name}</span><span>${Math.floor(d.cash||0).toLocaleString()} TL</span>`;
      box.appendChild(row);i++;
    });
  }catch(e){}
}

/* ANA REFRESH */
async function refreshAll(){
  try{
    if(!currentUid)return;
    const ref=doc(db,"users",currentUid);
    const snap=await getDoc(ref);
    if(!snap.exists())return;
    const d=snap.data();if(!d)return;
    currentUserData=d;
    const prices=await getMarket()||BASE_PRICE;
    const inv=d.inventory||{};
    const hiding=d.hiding&&d.hidingUntil>Date.now();
    const isJail=d.jailUntil&&d.jailUntil>Date.now();
    
    $("statusBox").innerHTML=`
      <div class="row"><span class="label">💵 Nakit</span><span class="value green">${Math.floor(d.cash||0).toLocaleString()} TL</span></div>
      <div class="row"><span class="label">🏦 Borç</span><span class="value red">${Math.floor(d.debt||0).toLocaleString()} TL</span></div>
      <div class="row"><span class="label">❤️ Can</span><span class="value">${d.health||0}/50</span></div>
      <div class="row"><span class="label">⚡ Enerji</span><span class="value yellow">${d.energy||0}/100</span></div>
      <div class="row"><span class="label">🚨 Aranma</span><span class="value red">${d.wanted||0}/100</span></div>
      <div class="row"><span class="label">🔒 Hapis</span><span class="value ${isJail?"red":"green"}">${isJail?"EVET":"hayır"}</span></div>
      <div class="row"><span class="label">🥷 Saklanma</span><span class="value blue">${hiding?"EVET":"hayır"}</span></div>`;
    
    const ml=$("marketList");ml.innerHTML="";
    COINS.forEach(c=>{
      const f=prices[c]||BASE_PRICE[c];
      const row=document.createElement("div");row.className="row";
      row.innerHTML=`<span class="label">📈 ${c}</span><span class="value">${f}</span>`;
      const b=document.createElement("button");b.className="buy";b.textContent="AL 100";b.onclick=()=>buyCoin(c,100);
      const s=document.createElement("button");s.className="sell";s.textContent="SAT";s.onclick=()=>sellCoin(c,0.001);
      row.appendChild(b);row.appendChild(s);ml.appendChild(row);
    });
    
    const al=$("assetList");al.innerHTML="";
    const port=d.portfolio||{};
    let bos=true;
    Object.keys(port).forEach(k=>{
      bos=false;
      const v=port[k];const f=prices[k]||BASE_PRICE[k];
      const row=document.createElement("div");row.className="row";
      row.innerHTML=`<span class="label">💰 ${k}: ${v.amount}</span><span class="value green">${(v.amount*f).toFixed(2)} TL</span>`;
      al.appendChild(row);
    });
    (d.assets||[]).forEach(a=>{
      bos=false;
      const row=document.createElement("div");row.className="row";
      row.innerHTML=`<span class="label">${a.name}</span><span class="value">+${a.income||0}/5dk</span>`;
      al.appendChild(row);
    });
    if(bos)al.innerHTML=`<div class="row"><span class="label" style="color:#556080">Boş</span></div>`;
    
    const jl=$("jobList");jl.innerHTML="";
    JOBS.forEach(j=>{
      const row=document.createElement("div");row.className="row";
      row.innerHTML=`<span class="label">${j.icon} ${j.name}</span><span class="value green">+${j.pay}</span>`;
      const b=document.createElement("button");b.className="work";b.textContent="ÇALIŞ";b.onclick=()=>work(j.id);
      row.appendChild(b);jl.appendChild(row);
    });
    
    const cl=$("crimeBox");cl.innerHTML="";
    CRIMES.forEach(c=>{
      const ok=hasAny(inv,c.requires);
      const row=document.createElement("div");row.className="row"+(ok?"":" locked");
      const g=c.requires.map(k=>ITEMS[k]?ITEMS[k].icon+" "+ITEMS[k].name:k).join("/");
      row.innerHTML=`<span class="label">${c.icon} ${c.name}<br><span style="font-size:9px;color:#556080">${g}</span></span>`;
      const b=document.createElement("button");b.className="crime";b.textContent=ok?"SOY":"🔒";
      b.disabled=!ok;b.onclick=()=>attemptCrime(c.id);
      row.appendChild(b);cl.appendChild(row);
    });
    
    const pb=$("playersBox");pb.innerHTML="";
    const players=await loadPlayers();
    if(players.length===0)pb.innerHTML=`<div class="row"><span class="label" style="color:#556080">Oyuncu yok</span></div>`;
    players.slice(0,10).forEach(p=>{
      const card=document.createElement("div");card.className="player-card";
      card.innerHTML=`<div class="pname">${p.name}</div><div class="pmeta">💰 ${Math.floor(p.cash||0).toLocaleString()} TL • ❤️ ${p.health||0}</div>`;
      pb.appendChild(card);
    });
    
    const hb=$("hideBox");hb.innerHTML="";
    if(hiding){
      const row=document.createElement("div");row.className="row";
      row.innerHTML=`<span class="label">🥷 ${d.hidingIn}</span>`;
      const b=document.createElement("button");b.textContent="ÇIK";b.onclick=stopHiding;
      row.appendChild(b);hb.appendChild(row);
    }else{
      const r1=document.createElement("div");r1.className="row";
      r1.innerHTML=`<span class="label">🌲 Sokakta (10 dk)</span>`;
      const b1=document.createElement("button");b1.textContent="SAKLAN";b1.onclick=()=>startHiding(10,"Sokak");
      r1.appendChild(b1);hb.appendChild(r1);
      (d.assets||[]).forEach(a=>{
        if(a.shelter){
          const r=document.createElement("div");r.className="row";
          r.innerHTML=`<span class="label">${a.name} (${a.shelterMin} dk)</span>`;
          const b=document.createElement("button");b.className="buy";b.textContent="SAKLAN";
          b.onclick=()=>startHiding(a.shelterMin,a.name);
          r.appendChild(b);hb.appendChild(r);
        }
      });
    }
    
    const sb=$("shopBox");sb.innerHTML="";
    Object.keys(ITEMS).forEach(k=>{
      const it=ITEMS[k];
      const row=document.createElement("div");row.className="row";
      row.innerHTML=`<span class="label">${it.icon} ${it.name}<br><span style="font-size:9px;color:#556080">${it.desc}</span></span><span class="value">${it.price.toLocaleString()}</span>`;
      const b=document.createElement("button");b.className="buy";b.textContent="AL";b.onclick=()=>buyItem(k);
      row.appendChild(b);sb.appendChild(row);
    });
    
    const ib=$("invBox");ib.innerHTML="";
    let invBos=true;
    Object.keys(inv).forEach(k=>{
      if(inv[k]>0&&ITEMS[k]){
        invBos=false;
        const row=document.createElement("div");row.className="row";
        row.innerHTML=`<span class="label">${ITEMS[k].icon} ${ITEMS[k].name}</span><span class="value">x${inv[k]}</span>`;
        ib.appendChild(row);
      }
    });
    if(invBos)ib.innerHTML=`<div class="row"><span class="label" style="color:#556080">Boş</span></div>`;
    
    const ab=$("assetBuyBox");ab.innerHTML="";
    ASSETS.forEach(a=>{
      const row=document.createElement("div");row.className="row";
      row.innerHTML=`<span class="label">${a.icon} ${a.name}<br><span style="font-size:9px;color:#556080">+${a.income}/5dk</span></span><span class="value">${a.price.toLocaleString()}</span>`;
      const b=document.createElement("button");b.className="buy";b.textContent="AL";b.onclick=()=>buyAsset(a.id);
      row.appendChild(b);ab.appendChild(row);
    });
    
    const hhb=$("healthBox");hhb.innerHTML="";
    const r1=document.createElement("div");r1.className="row";
    r1.innerHTML=`<span class="label">🏥 Hastane (+30)</span><span class="value">500 TL</span>`;
    const b1=document.createElement("button");b1.className="buy";b1.textContent="GİT";b1.onclick=heal;
    r1.appendChild(b1);hhb.appendChild(r1);
    const r2=document.createElement("div");r2.className="row";
    r2.innerHTML=`<span class="label">🍔 Yemek (+20)</span><span class="value">200 TL</span>`;
    const b2=document.createElement("button");b2.className="buy";b2.textContent="YE";b2.onclick=eat;
    r2.appendChild(b2);hhb.appendChild(r2);
    
    const cb=$("creditBox");cb.innerHTML="";
    const l1=document.createElement("button");l1.className="work";l1.textContent="💵 10K KREDİ";l1.style.width="100%";l1.onclick=()=>takeLoan(10000);
    const l2=document.createElement("button");l2.className="buy";l2.textContent="💸 10K ÖDE";l2.style.marginTop="6px";l2.style.width="100%";l2.onclick=()=>payDebt(10000);
    cb.appendChild(l1);cb.appendChild(l2);
    
    await refreshRanking();
    if(isAdmin)loadAdminPanel();
  }catch(e){console.error("refreshAll",e)}
}

/* ADMIN */
$("admClose").onclick=()=>{$("adminPanel").style.display="none"};
async function loadAdminPanel(){
  try{
    const q=query(collection(db,"users"),orderBy("cash","desc"),limit(50));
    const s=await getDocs(q);
    const box=$("admUsers");box.innerHTML="";
    s.forEach(docu=>{
      const d=docu.data();
      const row=document.createElement("div");row.className="adm-row";
      row.innerHTML=`<span style="flex:1 1 100%;font-size:10px;color:#888">${d.name} | ${Math.floor(d.cash||0).toLocaleString()} TL | ❤️${d.health||0} ⚡${d.energy||0}</span>`;
      const inp=document.createElement("input");inp.placeholder="TL";inp.type="number";
      const mk=(txt,fn)=>{const b=document.createElement("button");b.textContent=txt;b.onclick=fn;return b};
      row.appendChild(inp);
      row.appendChild(mk("+₺",async()=>{const v=parseInt(inp.value);if(!v)return;await updateDoc(doc(db,"users",docu.id),{cash:(d.cash||0)+v});toast(`+${v}`);loadAdminPanel()}));
      row.appendChild(mk("−₺",async()=>{const v=parseInt(inp.value);if(!v)return;await updateDoc(doc(db,"users",docu.id),{cash:Math.max(0,(d.cash||0)-v)});toast(`-${v}`);loadAdminPanel()}));
      row.appendChild(mk("❤️",async()=>{await updateDoc(doc(db,"users",docu.id),{health:50});toast("Can 50");loadAdminPanel()}));
      row.appendChild(mk("⚡",async()=>{await updateDoc(doc(db,"users",docu.id),{energy:100});toast("Enerji 100");loadAdminPanel()}));
      row.appendChild(mk("🔓",async()=>{await updateDoc(doc(db,"users",docu.id),{jailUntil:0});toast("Çıktı");loadAdminPanel()}));
      const bBan=mk(d.banned?"UNBAN":"BAN",async()=>{await updateDoc(doc(db,"users",docu.id),{banned:!d.banned});loadAdminPanel()});
      row.appendChild(bBan);
      box.appendChild(row);
    });
  }catch(e){alert("Admin: "+e.message)}
}
$("admGlobalAdd").onclick=async()=>{const s=await getDocs(collection(db,"users"));for(const d of s.docs)await updateDoc(d.ref,{cash:(d.data().cash||0)+1000});toast("Global +1000");loadAdminPanel()};
$("admGlobalSub").onclick=async()=>{const s=await getDocs(collection(db,"users"));for(const d of s.docs)await updateDoc(d.ref,{cash:Math.max(0,(d.data().cash||0)-1000)});toast("Global -1000");loadAdminPanel()};
$("admRefresh").onclick=()=>loadAdminPanel();

$("complaintSend").onclick=async()=>{
  const tip=$("complaintType").value,text=$("complaintText").value.trim();

  toast("✅ İletildi.");
